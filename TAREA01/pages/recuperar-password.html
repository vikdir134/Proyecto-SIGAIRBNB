<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stay.pe - Recuperar Contraseña</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body class="auth-body">

    <main class="auth-container">
        <div class="auth-card">
            <div class="logo-section">
                <a href="../HomePage.html" class="logo-link">
                    <span class="logo-text">Stay<span class="logo-dot-pe">.pe</span></span>
                </a>
            </div>

            <div class="auth-icon">
                <span style="font-size: 3rem;">🔑</span>
            </div>
            
            <h2>¿Olvidaste tu contraseña?</h2>
            <p class="auth-subtitle">Ingresa tu correo electrónico y te enviaremos un enlace para restablecerla.</p>

            <form action="verificar-email.html" class="auth-form">
                <div class="input-group">
                    <label for="email-recovery">Correo electrónico</label>
                    <input type="email" id="email-recovery" name="email" placeholder="ejemplo@correo.com" required>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Enviar enlace</button>
            </form>

            <div class="auth-footer">
                <p>¿Recordaste tu contraseña? <a href="login.html" class="auth-link">Volver al Login</a></p>
            </div>
        </div>
    </main>

</body>
</html>
