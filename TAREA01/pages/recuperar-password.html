<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stay.pe - Recuperar Contraseña</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body class="auth-body">
    <header class="main-header">
        <div class="logo-section">
            <a href="../HomePage.html">
                <span class="logo-text">Stay<span class="logo-dot-pe">.pe</span></span>
            </a>
        </div>
    </header>

    <main class="login-main">
        <div class="login-container">

            <div>
                <span style="font-size: 3rem;">🔑</span>
            </div>
            
            <h2>¿Olvidaste tu contraseña?</h2>
            <p>Ingresa tu correo electrónico y te enviaremos un enlace para restablecerla.</p>

            <form action="verificar-email.html">
                <div class="search-item">
                    <label for="email-recovery">Correo electrónico</label>
                    <input type="email" id="email-recovery" name="email" placeholder="ejemplo@correo.com" required>
                </div>

                <button type="submit" class="btn btn-primary btn-block btn-margin">Enviar enlace</button>
            </form>

            <div>
                <p>¿Recordaste tu contraseña? <a href="login.html" class="login-link">Volver al Login</a></p>
            </div>
        </div>
    </main>

    <footer class="main-footer">
        &copy; 2026 Stay.pe - Sistema Integral de Gestión de Inmuebles
    </footer>
</body>
</html>
