<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stay.pe - Iniciar Sesión</title>
    <link rel="stylesheet" href="../styles.css">
</head>

<body class="auth-body">
    <header class="main-header">
        <div class="logo-section">
            <a href="../HomePage.html">
                <span class="logo-text">Stay<span class="logo-dot-pe">.pe</span></span>
            </a>
        </div>
    </header>

    <main class="login-main">
        <div class="login-container">
            <h2>¡Bienvenido de nuevo!</h2>
            <p>Ingresa tus credenciales para acceder</p>

            <form action="perfil.html" method="GET">
                <div class="search-item">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
                </div>

                <div class="search-item">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>

                <div>
                    <a class="login-link" href="recuperar-password.html">¿Olvidaste tu contraseña?</a>
                </div>

                <button onclick="window.location.href='perfil.html'" type="submit"
                    class="btn btn-primary btn-block btn-margin">Ingresar</button>
            </form>

            <div>
                <p>¿No tienes una cuenta? <a class="login-link" href="registro.html" class="auth-link">Regístrate aquí</a></p>
            </div>
        </div>
    </main>

    <footer class="main-footer">
        &copy; 2026 Stay.pe - Sistema Integral de Gestión de Inmuebles
    </footer>
</body>

</html>
