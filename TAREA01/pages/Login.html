<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stay.pe - Iniciar Sesión</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body class="auth-body">
    <header class="main-header">
        <div class="logo-section">
            <a href="../HomePage.html" class="logo-link">
                <span class="logo-text">Stay<span class="logo-dot-pe">.pe</span></span>
            </a>
        </div>
    </header>

    <main class="auth-container">
        <div class="auth-card">
            <h2>¡Bienvenido de nuevo!</h2>
            <p class="auth-subtitle">Ingresa tus credenciales para acceder</p>

            <form action="perfil.html" method="GET" class="auth-form">
                <div class="input-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
                </div>

                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>

                <div class="auth-options">
                    <a href="recuperar-password.html" class="forgot-password">¿Olvidaste tu contraseña?</a>
                </div>

                <button onclick="window.location.href='perfil.html'" type="submit" class="btn btn-primary btn-block">Ingresar</button>
            </form>

            <div class="auth-footer">
                <p>¿No tienes una cuenta? <a href="registro.html" class="auth-link">Regístrate aquí</a></p>
            </div>
        </div>
    </main>

</body>
</html>
