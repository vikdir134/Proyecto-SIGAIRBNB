<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stay.pe - Mi Perfil</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body class="auth-body">
    <header class="main-header">
        <div class="logo-section">
            <a href="../HomePage.html">
                <span class="logo-text">Stay<span class="logo-dot-pe">.pe</span></span>
            </a>
        </div>

        <nav class="main-nav">
            <a href="#">Mis Reservas</a>
            <a href="#">Ayuda</a>
        </nav>

        <div class="header-actions">
            <button class="btn btn-primary">Juan Perez</button>
            <button class="btn btn-accent" onclick="window.location.href='login.html'">Cerrar Sesión</button>
        </div>

    </header>

    <!-- HU02: Edición de nombre y foto de perfil -->
    <main class="profile-main">
        <section>
            <div class="section">
                <h1>Configuración de Perfil</h1>
                <p class="section-description">Gestiona tu información personal y preferencias de contacto.</p>
            </div>

            <form>
                <div>
                    <div>
                        <img src="" alt="Foto de perfil">
                    </div>
                    <div>
                        <label for="photo-upload" class="btn btn-primary btn-margin">Cambiar foto</label>
                        <input type="file" id="photo-upload" accept="image/*" style="display: none;">
                        <p>JPG o PNG. Máximo 2MB.</p>
                    </div>
                </div>

                <div class="section">
                    <div>
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" value="Juan" placeholder="Tu nombre">
                    </div>

                    <div>
                        <label for="apellido">Apellidos</label>
                        <input type="text" id="apellido" value="Pérez" placeholder="Tus apellidos">
                    </div>

                    <div class="input-group">
                        <label for="email-display">Correo Electrónico</label>
                        <input type="email" id="email-display" value="juan.perez@ejemplo.com" disabled>
                        <small>El correo no se puede cambiar por seguridad.</small>
                    </div>
                </div>

                <hr>

                <!-- HU02: Configuración de notificaciones -->
                <div>
                    <h3>Preferencias de Notificaciones</h3>
                    <div>
                        <label>
                            <input type="checkbox" checked name="notif-email">
                            Recibir alertas de reservas por Email
                        </label>
                        <label>
                            <input type="checkbox" name="notif-push">
                            Recibir notificaciones Push en el navegador
                        </label>
                    </div>
                </div>

                <div class="section">
                    <button type="submit" class="btn btn-light btn-margin" onclick="window.location.href='../HomePage.html'">Cancelar</button>
                    <button type="submit" class="btn btn-primary btn-margin">Guardar Cambios</button>
                </div>
            </form>
        </section>
    </main>

    <footer class="main-footer">
        &copy; 2026 Stay.pe - Sistema Integral de Gestión de Inmuebles
    </footer>

</body>
</html>
