<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stay.pe - Verificar Email</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body class="auth-body">

    <main class="auth-container">
        <div class="auth-card">
            <div class="logo-section">
                <a href="homePage.html" class="logo-link">
                    <span class="logo-text">Stay<span class="logo-dot-pe">.pe</span></span>
                </a>
            </div>

            <div class="verification-icon">
                <span style="font-size: 3rem;">✉️</span>
            </div>
            
            <h2>¡Casi listo!</h2>
            <p class="auth-subtitle">Hemos enviado un enlace de confirmación a tu correo electrónico.</p>

            <div class="verification-details">
                <p>Por favor, revisa tu bandeja de entrada y haz clic en el botón para activar tu cuenta y poder iniciar sesión.</p>
                <p class="text-small">¿No recibiste nada? Revisa tu carpeta de spam o correo no deseado.</p>
            </div>

            <div class="auth-footer">
                <a href="login.html" class="btn btn-primary btn-block">Ir al Inicio de Sesión</a>
            </div>
        </div>
    </main>

</body>
</html>
