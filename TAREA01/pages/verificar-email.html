<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stay.pe - Verificar Email</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body class="auth-body">
    <header class="main-header">
        <div class="logo-section">
            <a href="../HomePage.html" class="logo-link">
                <span class="logo-text">Stay<span class="logo-dot-pe">.pe</span></span>
            </a>
        </div>
    </header>

    <main class="login-main">
        <div class="login-container">

            <div>
                <span style="font-size: 3rem;">✉️</span>
            </div>
            
            <h2>¡Casi listo!</h2>
            <p>Hemos enviado un enlace de confirmación a tu correo electrónico.</p>

            <div>
                <p>Por favor, revisa tu <strong>bandeja de entrada</strong> y haz clic en el botón para activar tu cuenta y poder iniciar sesión.</p>
                <p>¿No recibiste nada? Revisa tu <strong>carpeta de spam</strong> o <strong>correo no deseado</strong> .</p>
            </div>

            <div>
                <a href="login.html" class="btn btn-primary btn-block">Ir al Inicio de Sesión</a>
            </div>
        </div>
    </main>

</body>
</html>
